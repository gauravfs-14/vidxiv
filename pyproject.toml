[project]
name = "vidxiv"
version = "0.2.0"
description = "Turn an arXiv paper or a PDF into a narrated explainer video, using the Claude Code or Codex CLI you already have."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "requests>=2.31",
    "numpy>=1.26",
    "soundfile>=0.12",
    "kokoro-onnx>=0.4",
    "faster-whisper>=1.0",
]

[project.scripts]
vidxiv = "vidxiv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vidxiv"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
