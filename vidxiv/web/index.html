<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vidxiv</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23D9572B'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='%23F7F0E3'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
  <script>
    (function () {
      var t = localStorage.getItem("vidxiv-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = t;
      document.documentElement.style.colorScheme = t;
    })();
  </script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div id="offline" class="offline" role="alert" hidden>
    Cannot reach the vidxiv server. Check that it is still running. Retrying.
  </div>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="vidxiv, home"><span class="brand-mark" aria-hidden="true"></span>vidxiv</a>
    <button id="theme-toggle" class="icon-btn" type="button"></button>
  </header>
  <main id="view" tabindex="-1"></main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p class="noscript">vidxiv needs JavaScript. Turn it on for this page.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
